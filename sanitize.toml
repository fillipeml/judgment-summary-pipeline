[brand]
terms = ["STG", "STGLaw", "Schmeisser", "Terra Gomes", "stglaw", "RenavePro", "Cipasa", "cipasa igor", "Nova Cipasa", "ELAW", "AUTOJUR", "Railway"]

[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br"]

[hosts]
suffixes = ["sharepoint.com", "onmicrosoft.com", "railway.app", "amazonaws.com"]

[allow]
# lock file and the demo's run output (git-ignored)
paths = ["package-lock.json", "node_modules/*", "node_modules/**/*", ".demo/*", ".demo/**/*", "out/*", "out/**/*"]
# Fixture case numbers are dated 2099 (a year no real case can carry) and have invalid check
# digits; they appear in the fixtures, the tests, the README and the sample output.
patterns = ['\d{7}-\d{2}\.2099\.\d\.\d{2}\.\d{4}']
